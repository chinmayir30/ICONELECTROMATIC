name: Supabase Database Keep-Alive

on:
  schedule:
    # Runs at 04:00 UTC every 3 days (well within Supabase's 7-day inactivity pause limit)
    - cron: '0 4 */3 * *'
  workflow_dispatch:
    # Allows manual execution anytime via GitHub Actions UI

jobs:
  ping-supabase:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::notice ::Supabase credentials (VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY) are not set in GitHub Secrets/Variables. Skipping ping."
            exit 0
          fi

          # Clean URL trailing slash
          CLEAN_URL="${SUPABASE_URL%/}"
          ENDPOINT="${CLEAN_URL}/rest/v1/cms_content?select=key&limit=1"

          echo "Sending keep-alive ping to ${CLEAN_URL}..."
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$ENDPOINT" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}" \
            -H "Content-Type: application/json" \
            --max-time 15)

          echo "HTTP Response Status: ${HTTP_STATUS}"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Supabase database keep-alive ping succeeded (HTTP ${HTTP_STATUS}). Inactivity timer reset."
          else
            echo "⚠️ Keep-alive ping returned status ${HTTP_STATUS}. Target endpoint responded, activity registered."
          fi

