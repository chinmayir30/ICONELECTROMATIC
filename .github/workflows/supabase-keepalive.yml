name: Supabase Database Keep-Alive

on:
  schedule:
    # Runs at 04:00 UTC every 3 days (within Supabase's 7-day inactivity window).
    - cron: '0 4 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    name: Ping Supabase REST API
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Database
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || vars.VITE_SUPABASE_ANON_KEY }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${SUPABASE_URL}" || -z "${SUPABASE_KEY}" ]]; then
            echo "::error::Supabase credentials (VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY) are not configured. Keep-alive ping cannot run."
            exit 1
          fi

          CLEAN_URL="${SUPABASE_URL%/}"
          ENDPOINT="${CLEAN_URL}/rest/v1/cms_content?select=key&limit=1"

          echo "Sending keep-alive ping to configured Supabase REST endpoint."
          HTTP_STATUS="$(curl --silent --show-error --output /dev/null --write-out "%{http_code}" \
            --request GET "${ENDPOINT}" \
            --header "apikey: ${SUPABASE_KEY}" \
            --header "Authorization: Bearer ${SUPABASE_KEY}" \
            --header "Content-Type: application/json" \
            --connect-timeout 10 \
            --max-time 20)"

          if [[ ! "${HTTP_STATUS}" =~ ^2[0-9][0-9]$ ]]; then
            echo "::error::Supabase keep-alive request failed with HTTP ${HTTP_STATUS}."
            exit 1
          fi

          echo "Supabase keep-alive request succeeded (HTTP ${HTTP_STATUS})."
